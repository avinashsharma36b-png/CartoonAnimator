<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desi Cartoon Animator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eeeeee;
}
header{
  background:#222;
  color:white;
  padding:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.toolbar{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  overflow-x:auto;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  background:#333;
  color:white;
  font-size:15px;
}
button:active{transform:scale(.96)}

#stage{
  margin:10px auto;
  width:94%;
  height:400px;
  background:#9bd7ff;
  border:4px solid #222;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:100px;
  background:#69b34c;
}

#character{
  position:absolute;
  bottom:70px;
  left:42%;
  font-size:90px;
  cursor:move;
  user-select:none;
  transition:transform .2s;
}

.timeline{
  background:white;
  margin:10px;
  padding:12px;
  border-radius:10px;
}

.track{
  height:45px;
  background:#ddd;
  border-radius:6px;
  margin-top:8px;
  position:relative;
}

.key{
  position:absolute;
  width:18px;
  height:18px;
  background:#ff9800;
  border-radius:50%;
  top:13px;
  left:20px;
}
</style>
</head>

<body>

<header>🎬 Desi Cartoon Animator</header>

<div class="toolbar">
  <button onclick="addCharacter()">👤 Character</button>
  <button onclick="moveCharacter()">➡️ Move</button>
  <button onclick="jumpCharacter()">⬆️ Jump</button>
  <button onclick="resetCharacter()">🔄 Reset</button>
</div>

<div id="stage">
  <div id="ground"></div>
  <div id="character">🧑</div>
</div>

<div class="timeline">
  <b>🎞️ Timeline</b>
  <div class="track">
    <div class="key"></div>
  </div>
</div>

<script>
const character=document.getElementById("character");

function addCharacter(){
  character.style.display="block";
}

function moveCharacter(){
  character.style.left="65%";
}

function jumpCharacter(){
  character.style.transform="translateY(-100px)";
  setTimeout(()=>{
    character.style.transform="translateY(0)";
  },500);
}

function resetCharacter(){
  character.style.left="42%";
  character.style.transform="translateY(0)";
}
</script>

</body>
</html>
